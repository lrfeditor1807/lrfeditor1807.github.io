<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YouTube Grid Controller</title>
  <style>
    :root {
      --bg: #0f0f12;
      --tile: #161719;
      --accent: #ff0000;
      --muted: #bdbdbd;
    }
    body { margin: 0; font-family: system-ui, Arial; background: var(--bg); color: #fff; display:flex; gap:20px; padding:20px; box-sizing:border-box; min-height:100vh; }
    .left { width: 520px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    h1 { font-size:18px; margin:0; }
    .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    .tile { background: var(--tile); border-radius:8px; padding:8px; cursor:pointer; display:flex; gap:8px; align-items:center; transition:transform .12s, box-shadow .12s; }
    .tile:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.6); }
    .thumb { width:160px; height:90px; flex:0 0 160px; background:#000; border-radius:6px; overflow:hidden; }
    .meta { flex:1; }
    .title { font-weight:600; font-size:14px; margin-bottom:6px; }
    .subtitle { color:var(--muted); font-size:12px; }
    .tile.playing { outline:3px solid var(--accent); box-shadow:0 12px 30px rgba(255,0,0,.12); }
    .controls { margin-top:12px; display:flex; gap:8px; align-items:center; }
    button { background:var(--accent); color:#fff; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; }
    button.secondary { background:#2a2a2a; color:var(--muted); }
    .player-area { width:560px; background: #0b0b0b; border-radius:8px; padding:12px; box-sizing:border-box; }
    #player { width:100%; height:315px; background:#000; border-radius:6px; overflow:hidden; }
    pre#status { margin-top:12px; background:#070707; color:var(--muted); padding:8px; border-radius:6px; max-height:120px; overflow:auto; white-space:pre-wrap; }
    @media (max-width:1000px) {
      body { flex-direction:column; }
      .left, .player-area { width:100%; }
      .grid { grid-template-columns:repeat(1,1fr); }
    }
  </style>
</head>
<body>
  <div class="left">
    <div class="header">
      <h1>YouTube Grid</h1>
      <div>
        <button id="refreshList" class="secondary">Refresh</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
      <button id="prev">Prev</button>
      <button id="playPause">Pause</button>
      <button id="next">Next</button>
      <button id="stop" class="secondary">Stop</button>
    </div>
  </div>

  <div class="player-area">
    <div id="player"></div>
    <pre id="status">No video loaded.</pre>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
    </html>
