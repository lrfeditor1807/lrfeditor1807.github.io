<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AsTeRICS Grid — Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>AsTeRICS Grid — Prototype</h1>
    <div class="top-controls">
      <select id="boardSelect"></select>
      <button id="newBoardBtn">+ New board</button>
      <button id="saveBoardBtn">Save board</button>
      <select id="loginMode">
        <option value="offline">Offline login</option>
        <option value="online">Online login (simulated)</option>
      </select>
      <button id="loginBtn">Login</button>
      <button id="settingsBtn">Settings</button>
      <button id="aboutBtn">About</button>
    </div>
  </header>

  <main>
    <section id="gridContainer"></section>
  </main>

  <!-- Modals -->
  <div id="modal" class="modal hidden" role="dialog" aria-hidden="true">
    <div class="modal-content">
      <button class="close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <template id="cellTemplate">
    <div class="cell">
      <div class="cell-img"></div>
      <div class="cell-label"></div>
    </div>
  </template>

  <footer>
    <small>Prototype — images/pictograms should be added via URL (ARASAAC/OpenSymbols/Google). Attribution: ARASAAC / OpenSymbols as required by their licenses.</small>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
