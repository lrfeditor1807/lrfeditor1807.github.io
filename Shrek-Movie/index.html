<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shrek Movie — File Structure Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Shrek Movie — File Structure</h1>
    <p>A simple interactive file-structure demo showing movie data and files for "Shrek".</p>
  </header>

  <main>
    <aside id="treePane">
      <h2>Files</h2>
      <div id="fileTree" class="tree"></div>
    </aside>

    <section id="viewer">
      <h2 id="viewerTitle">Select a file</h2>
      <pre id="fileContent" class="content"></pre>
    </section>
  </main>

  <footer>
    <small>Created for the Shrek Movie File Structure demo</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
