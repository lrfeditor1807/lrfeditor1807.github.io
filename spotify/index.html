<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spotify Grid Controller</title>
  <style>
    body { font-family: system-ui, Arial; display:flex; align-items:flex-start; justify-content:center; margin:20px; background:#121212; color:#fff; }
    .container { width:760px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .tile { background:#181818; padding:12px; border-radius:8px; text-align:center; cursor:pointer; }
    .tile.playing { outline:3px solid #1db954; }
    input.token { width:60%; padding:8px; border-radius:6px; border:1px solid #333; background:#0f0f0f; color:#fff; }
    button { padding:8px 10px; border-radius:6px; border:0; background:#1db954; color:#000; cursor:pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <input id="token" class="token" placeholder="Paste Spotify access token (with playback scopes)" />
        <button id="saveToken">Use token</button>
      </div>
      <div>
        <button id="refreshState">Refresh state</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div style="margin-top:14px; display:flex; gap:8px;">
      <button id="prev">Prev</button>
      <button id="pause">Pause</button>
      <button id="next">Next</button>
    </div>

    <pre id="status" style="margin-top:12px; background:#0f0f0f; padding:10px; border-radius:6px; color:#b3b3b3;"></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
