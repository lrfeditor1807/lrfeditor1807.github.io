name: ➕ Create Players or Friends and Teams on Toon Blast
description: Create a Toon Blast player, friend, or team
title: "Create Toon Blast: "
labels:
  - toon-blast
body:
  - type: markdown
    attributes:
      value: |
        Complete the player or team information below. Choose either a player/friend or a team.

  - type: dropdown
    id: create_type
    attributes:
      label: Create a player, friend, or team (required)
      options:
        - Player or friend
        - Team
    validations:
      required: true

  - type: input
    id: player_name
    attributes:
      label: Player name
      description: Write the player name.
      placeholder: Player name

  - type: input
    id: player_id
    attributes:
      label: Player ID
      description: Write the player ID.
      placeholder: Player ID

  - type: input
    id: player_country
    attributes:
      label: Player country
      description: Write the player country.
      placeholder: Country

  - type: dropdown
    id: player_photo_and_frame
    attributes:
      label: Select player photo and frame
      options:
        - Bruno
        - Cooper
        - Wally
        - Carnival Collection Magician Cooper
        - Carnival Collection Jester Wally
        - Temple Guardians

  - type: dropdown
    id: player_frame_color
    attributes:
      label: Player frame color
      options:
        - Red
        - Blue
        - Green
        - Orange
        - Yellow

  - type: input
    id: team_name
    attributes:
      label: Team name
      description: Write the team name.
      placeholder: Team name

  - type: input
    id: team_id
    attributes:
      label: Team ID
      description: Write the team ID.
      placeholder: Team ID

  - type: dropdown
    id: team_photo
    attributes:
      label: Team photo
      description: Select the team photo.
      options:
        - solitaire

  - type: dropdown
    id: team_country
    attributes:
      label: Team country
      options:
        - Chile
        - Argentina
        - Brazil
        - United States
        - United Kingdom

  - type: input
    id: team_fit
    attributes:
      label: Team fit
      description: Write the team fit.
      placeholder: Fit

  - type: dropdown
    id: team_color
    attributes:
      label: Team color
      options:
        - Red
        - Blue
        - Green
        - Orange
        - Yellow

  - type: dropdown
    id: team_level
    attributes:
      label: Team level
      options:
        - "0"
        - "50"
        - "100"
        - "150"
        - "200"
        - "250"
        - "300"
        - "350"
        - "400"
        - "450"
        - "500"
        - "550"
        - "600"
        - "650"
        - "700"
        - "750"
        - "800"
        - "850"
        - "900"
        - "950"
        - "1000"

  - type: textarea
    id: team_description
    attributes:
      label: Team description
      description: Write the team description.
      placeholder: Team description

  - type: input
    id: buy_coins
    attributes:
      label: Buy coins
      description: Enter the number of coins to buy.
      placeholder: "0"
      value: "0"

  - type: checkboxes
    id: agreement
    attributes:
      label: Continue (OK)
      options:
        - label: Agree with players, teams, collections and more.
          required: true
